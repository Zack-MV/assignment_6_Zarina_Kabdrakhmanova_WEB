<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>The Party - jQuery Assignment</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <header>
        <h1>The Party, 19:30 - 22:30</h1>
        <button id="clear-btn">Clear / Reset</button>
    </header>
    <div id="house"></div>
    <section id="cases-panel">
        <h2>Cases</h2>
        <div id="cases-buttons"></div>
        <div id="case-result"></div>
    </section>
    <div id="guest-modal" class="modal-hidden">
        <div class="modal-content">
            <button id="close-modal">×</button>
            <img id="modal-avatar" src="" alt="Avatar">
            <h3 id="modal-name"></h3>
            <p id="modal-info"></p>
            <div id="move-buttons"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
